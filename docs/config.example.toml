# ~/.config/svmonitor/config.toml  (all keys optional except server names)
# SVMonitor never stores passwords or keys; servers refer to aliases in ~/.ssh/config.

[general]
ssh_binary = "ssh"
interval_secs = 60            # healthy server poll interval (min 5)
probe_timeout_secs = 20       # hard kill deadline for one ssh probe
connect_timeout_secs = 10     # ssh ConnectTimeout
failure_threshold = 3         # consecutive failures before "unreachable" (debounce)
retry_interval_secs = 10      # retry spacing while failures are pending
down_interval_max_secs = 300  # backoff cap while a server is down
max_parallel_probes = 4
check_tailscale = true        # classify tailnet hosts via the local tailscaled socket
notifications = true
notify_cooldown_secs = 900    # same event kind for same server at most every 15 min
terminal = ""                 # "" = desktop/user default via xdg-terminal-exec; or app-only argv prefix
history_max_events = 2000
keep_samples = true           # also write samples.jsonl (one line per poll)

[thresholds]                  # resource alerts (need `samples` consecutive polls)
cpu_pct = 95.0
mem_pct = 92.0
swap_pct = 80.0
disk_pct = 90.0
load_per_core = 4.0
samples = 3

[[server]]
name = "my-server" # Alias in ~/.ssh/config
# net_interface = "eth0"         # Specific interface to monitor (1-15 chars, [A-Za-z0-9._:@-]).
                                 # If omitted, auto-selects the default route interface from
                                 # /proc/net/route, or the busiest physical-looking interface.
                                 # Virtual interfaces (lo, docker*, veth*, br-*, virbr*, tailscale*,
                                 # tun*, wg*) are ignored by default. Tailscale traffic is never summed
                                 # into default traffic; set to "tailscale0" to monitor it explicitly.
                                 # Sampling: first poll samples across 1s; subsequent polls compute
                                 # average rate from counter deltas / remote uptime. Counter resets or
                                 # SSH downtime mark rates as N/A and retained metrics as stale.

# Manual server (no alias): specify host directly.
# [[server]]
# name = "scratch-box"
# host = "203.0.113.10"
# user = "deploy"
# port = 2222
# identity_file = "~/.ssh/id_ed25519" # path only
