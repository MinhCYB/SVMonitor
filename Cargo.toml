[package]
name = "svmonitor"
version = "0.1.3"
edition = "2024"
description = "Lightweight SSH-based server monitor with system tray for Linux"
license = "MIT"
readme = "README.md"
rust-version = "1.89"
repository = "https://github.com/MinhCYB/SVMonitor"
homepage = "https://github.com/MinhCYB/SVMonitor"

[lib]
name = "svmonitor"
path = "src/lib.rs"

[[bin]]
name = "svmonitor"
path = "src/main.rs"

[[bin]]
name = "svmonitor-popup"
path = "src/bin/svmonitor-popup.rs"
required-features = ["popup"]

[features]
popup = ["dep:gtk4"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
gtk4 = { version = "0.10", optional = true, features = ["v4_8"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
